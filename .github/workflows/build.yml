name: NKPlayer - Landscape Fix (v1.0.89)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Generate NKPlayer Project
        run: |
          flutter create --org com.nareshkushmi --project-name nkplayer .
          
          # Fix: Add video_player dependency to pubspec.yaml
          flutter pub add video_player

          # Android Settings
          sed -i 's/android:label="nkplayer"/android:label="NKPlayer"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true

          cat << 'DART' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:video_player/video_player.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const NKPlayerApp());
          }

          class NKPlayerApp extends StatelessWidget {
            const NKPlayerApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'NKPlayer',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(useMaterial3: true),
                home: const VideoListPage(),
              );
            }
          }

          class VideoListPage extends StatelessWidget {
            const VideoListPage({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("NKPlayer")),
                body: ListView(
                  children: [
                    ListTile(
                      leading: const Icon(Icons.video_collection, color: Colors.red),
                      title: const Text("Sample Video"),
                      subtitle: const Text("Watch in Fullscreen Landscape"),
                      onTap: () => Navigator.push(
                        context,
                        MaterialPageRoute(builder: (_) => const PlayerPage()),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class PlayerPage extends StatefulWidget {
            const PlayerPage({super.key});
            @override
            State<PlayerPage> createState() => _PlayerPageState();
          }

          class _PlayerPageState extends State<PlayerPage> {
            late VideoPlayerController _controller;
            bool _isFullScreen = false;
            bool _showControls = true;

            @override
            void initState() {
              super.initState();
              _controller = VideoPlayerController.networkUrl(
                Uri.parse("https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"),
              )..initialize().then((_) {
                setState(() {});
                _controller.play();
              });
            }

            void _toggleFullScreen() {
              setState(() {
                _isFullScreen = !_isFullScreen;
              });

              if (_isFullScreen) {
                SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
                SystemChrome.setPreferredOrientations([
                  DeviceOrientation.landscapeLeft,
                  DeviceOrientation.landscapeRight,
                ]);
              } else {
                SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
                SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              }
            }

            @override
            void dispose() {
              _controller.dispose();
              SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (!_controller.value.isInitialized) {
                return const Scaffold(body: Center(child: CircularProgressIndicator()));
              }

              return Scaffold(
                backgroundColor: Colors.black,
                body: GestureDetector(
                  onTap: () => setState(() => _showControls = !_showControls),
                  child: Stack(
                    alignment: Alignment.center,
                    children: [
                      // Video display area
                      Center(
                        child: AspectRatio(
                          aspectRatio: _controller.value.aspectRatio,
                          child: VideoPlayer(_controller),
                        ),
                      ),

                      // Controls Layer (Always active/touchable when visible)
                      if (_showControls) ...[
                        Container(color: Colors.black26), // Slight dimming
                        
                        // Back Button
                        Positioned(
                          top: 40,
                          left: 20,
                          child: IconButton(
                            icon: const Icon(Icons.arrow_back, color: Colors.white, size: 30),
                            onPressed: () => Navigator.pop(context),
                          ),
                        ),

                        // Center Play Controls
                        Center(
                          child: Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              IconButton(
                                icon: const Icon(Icons.replay_10, size: 50, color: Colors.white),
                                onPressed: () => _controller.seekTo(_controller.value.position - const Duration(seconds: 10)),
                              ),
                              IconButton(
                                icon: Icon(
                                  _controller.value.isPlaying ? Icons.pause_circle : Icons.play_circle,
                                  size: 80,
                                  color: Colors.white,
                                ),
                                onPressed: () {
                                  setState(() {
                                    _controller.value.isPlaying ? _controller.pause() : _controller.play();
                                  });
                                },
                              ),
                              IconButton(
                                icon: const Icon(Icons.forward_10, size: 50, color: Colors.white),
                                onPressed: () => _controller.seekTo(_controller.value.position + const Duration(seconds: 10)),
                              ),
                            ],
                          ),
                        ),

                        // Bottom Seekbar & Fullscreen Toggle
                        Positioned(
                          bottom: 20,
                          left: 20,
                          right: 20,
                          child: Column(
                            children: [
                              VideoProgressIndicator(_controller, allowScrubbing: true),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  ValueListenableBuilder(
                                    valueListenable: _controller,
                                    builder: (context, VideoPlayerValue value, child) {
                                      return Text(
                                        "${value.position.toString().split(".")[0]} / ${value.duration.toString().split(".")[0]}",
                                        style: const TextStyle(color: Colors.white),
                                      );
                                    },
                                  ),
                                  IconButton(
                                    icon: Icon(_isFullScreen ? Icons.fullscreen_exit : Icons.fullscreen, color: Colors.white, size: 30),
                                    onPressed: _toggleFullScreen,
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NKPlayer-v1.0.89-fixed
          path: build/app/outputs/flutter-apk/app-release.apk
